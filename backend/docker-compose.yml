services:
  db:
    image: postgis/postgis:16-3.4
    container_name: servconnect_db
    environment:
      POSTGRES_DB: servconnect
      POSTGRES_USER: servconnect_user
      POSTGRES_PASSWORD: servconnect_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  web:
    build: .
    container_name: servconnect_web
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - db

volumes:
  postgres_data: