services:
  db:
    image: postgis/postgis:16-3.4
    container_name: servconnect_db
    environment:
      POSTGRES_DB: servconnect
      POSTGRES_USER: servconnect_user
      POSTGRES_PASSWORD: servconnect_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: